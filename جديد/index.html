let lang=localStorage.getItem('ecf-lang')||'ar',cart=JSON.parse(localStorage.getItem('ecf-cart')||'[]'),state={color:1,age:6,size:'L'};const t=k=>tr[lang][k]||k;function imgPath(id,n){if(id==='adult')return `assets/adults/adult-${String(n).padStart(2,'0')}.jpg`;return `assets/kids/${id}/color-${String(n).padStart(2,'0')}.jpg`}function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('en',lang==='en');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';renderGrid();updateCount();if(new URLSearchParams(location.search).has('product'))renderDetail();if(document.getElementById('overlay').classList.contains('open'))renderCart()}function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('ecf-lang',lang);applyLang()}
function renderGrid(){let html=`<article class="card" onclick="openProduct('adult')"><div class="photo"><img src="${imgPath('adult',1)}" alt="${t('adult')}"><span class="badge">${t('sizes')}: L–XXL</span></div><div class="cardbody"><h3>${t('adult')}</h3><p>${t('adultDesc')}</p><span class="price">${t('adultPrice')}</span><div class="swatches">${Array.from({length:adultCount},(_,i)=>`<span class="swatch"><img src="${imgPath('adult',i+1)}" loading="lazy"></span>`).slice(0,8).join('')}<span class="more">+${adultCount-8}</span></div></div></article>`;for(const age of [6,8,10,12])html+=`<article class="card" onclick="openProduct('${age}')"><div class="photo"><img src="${imgPath(age,1)}" loading="lazy" alt="${t('kids')}${age}"><span class="badge">${t('each')} · 600 EGP</span></div><div class="cardbody"><h3>${t('kids')}${age}${t('years')}</h3><p>${t('kidDesc')}</p><span class="price">600 EGP</span><div class="swatches">${Array.from({length:kids[age]},(_,i)=>`<span class="swatch"><img src="${imgPath(age,i+1)}" loading="lazy"></span>`).slice(0,7).join('')}<span class="more">${kids[age]} ${lang==='ar'?'ألوان':'colors'}</span></div></div></article>`;document.getElementById('grid').innerHTML=html}
function openProduct(id){history.pushState({},'',`?product=${id}#product`);renderDetail();window.scrollTo(0,0)}function goHome(e){e.preventDefault();history.pushState({},'',location.pathname);document.getElementById('home').classList.remove('hidden');document.getElementById('product').classList.add('hidden');window.scrollTo(0,0)}window.onpopstate=()=>{if(new URLSearchParams(location.search).has('product'))renderDetail();else goHome(new Event('click'))};function renderDetail(){const id=new URLSearchParams(location.search).get('product');if(!id)return;document.getElementById('home').classList.add('hidden');const root=document.getElementById('product');root.classList.remove('hidden');const adult=id==='adult',count=adult?adultCount:kids[id],title=adult?t('adult'):t('kids')+id+t('years');root.innerHTML=`<section class="detail"><div class="detailPhoto"><img id="heroProduct" src="${imgPath(id,state.color)}" alt="${title}"></div><div class="detailInfo"><a class="back" href="#" onclick="goHome(event)">← ${t('back')}</a><h1>${title}</h1><p>${adult?t('adultDesc'):t('kidDesc')}</p><div class="detailPrice">${adult?t('adultPrice'):'600 EGP'}</div><div class="label">${t('colors')} (${count})</div><div class="colorgrid">${Array.from({length:count},(_,i)=>`<button class="colorbtn ${state.color===i+1?'active':''}" onclick="chooseColor('${id}',${i+1},this)" aria-label="${t('unknownColor')} ${i+1}"><img src="${imgPath(id,i+1)}"></button>`).join('')}</div>${adult?`<div class="label">${t('sizes')}</div><div class="ages">${['L','XL','XXL'].map(x=>`<button class="agebtn ${state.size===x?'active':''}" onclick="chooseSize('${x}',this)">${x}</button>`).join('')}</div>`:`<div class="label">${t('age')}</div><div class="ages">${[6,8,10,12].map(a=>`<button class="agebtn ${Number(id)===a?'active':''}" onclick="openProduct('${a}')">${a} ${t('years')}</button>`).join('')}</div>`}<button class="add" onclick="addToCart('${id}')">${t('add')}</button><p class="notice">${t('shipping')}<br>${lang==='ar'?'للطلب أو الاستفسار:':'For orders and enquiries:'} <a href="tel:01004206146">01004206146</a> · <a href="tel:01060206478">01060206478</a></p></div></section>`}function chooseColor(id,n,btn){state.color=n;document.getElementById('heroProduct').src=imgPath(id,n);document.querySelectorAll('.colorbtn').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function chooseSize(x,b){state.size=x;document.querySelectorAll('.agebtn').forEach(y=>y.classList.remove('active'));b.classList.add('active')}function addToCart(id){const adult=id==='adult',label=adult?t('adult'):t('kids')+id+t('years'),price=adult?0:600,key=id+'-'+state.color+'-'+(adult?state.size:'');const row=cart.find(x=>x.key===key);if(row)row.qty++;else cart.push({key,id,color:state.color,age:adult?null:Number(id),size:adult?state.size:null,label,price,qty:1});localStorage.setItem('ecf-cart',JSON.stringify(cart));updateCount();openCart()}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}function openCart(){document.getElementById('overlay').classList.add('open');renderCart()}function closeCart(){document.getElementById('overlay').classList.remove('open')}function renderCart(){const box=document.getElementById('cartItems'),bottom=document.getElementById('cartBottom');if(!cart.length){box.innerHTML=`<div class="empty">${t('empty')}</div>`;bottom.innerHTML='';return}box.innerHTML=cart.map((x,i)=>`<div class="cartrow"><img src="${imgPath(x.id,x.color)}"><div><b>${x.label}</b><div style="color:#777;font-size:13px">${x.id==='adult'?t('size')+': '+x.size:t('colors')+': '+x.color}</div><div>${x.price?x.price+' EGP':t('adultPrice')}</div><div class="qty"><button onclick="changeQty(${i},-1)">−</button>${x.qty}<button onclick="changeQty(${i},1)">+</button><button onclick="removeItem(${i})">${t('remove')}</button></div></div><b>${x.price?x.price*x.qty+' EGP':''}</b></div>`).join('');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const lines=cart.map(x=>`${x.label} | ${x.id==='adult'?t('size')+': '+x.size:t('colors')+': '+x.color} | qty ${x.qty} | ${x.price||t('adultPrice')}`).join('\n');const msg=encodeURIComponent(`Hello, I would like to place an order:\n${lines}\n${t('subtotal')}: ${total} EGP\n${t('shipping')}`);bottom.innerHTML=`<div class="total"><span>${t('subtotal')}</span><span>${total} EGP${cart.some(x=>!x.price)?' + '+(lang==='ar'?'سعر القطع يُحدد عند التأكيد':'adult item price on confirmation'):''}</span></div><a class="checkout" href="https://wa.me/201004206146?text=${msg}" target="_blank">${t('checkout')}</a><p class="notice">${t('shipping')}</p>`}function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);localStorage.setItem('ecf-cart',JSON.stringify(cart));updateCount();renderCart()}function removeItem(i){cart.splice(i,1);localStorage.setItem('ecf-cart',JSON.stringify(cart));updateCount();renderCart()}applyLang();
